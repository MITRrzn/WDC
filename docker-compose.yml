services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: webhooks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d webhooks"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./migrations:/migrations
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://postgres:postgres@postgres:5432/webhooks?sslmode=disable",
        "up"
      ]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command: ["/app/api"]
    environment:
      APP_PORT: ${APP_PORT}
      DATABASE_URL: ${DB_URL}
      DELIVERY_TIMEOUT: "5s"
      MAX_ATTEMPTS: "10"
      RETRY_BASE_DELAY: "5s"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DB_URL}
      DELIVERY_TIMEOUT: "5s"
      MAX_ATTEMPTS: "10"
      RETRY_BASE_DELAY: "5s"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data: